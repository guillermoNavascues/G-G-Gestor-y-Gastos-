<title>G&amp;G</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

<style>
/* ===== G&G · rediseño: oscuro con acento lima ===================================
   Un solo tema a propósito: la identidad es el negro con el verde lima. Todos los
   colores salen de estos tokens, pintados de forma explícita. */
:root{
  --bg:#0B0D0A; --bg-2:#0E110C;
  --card:#121510; --card-2:#191D16; --card-3:#20251C;
  --line:#232920; --line-2:#2E3529;
  --ink:#F1F4EC; --ink-2:#A7B0A0; --ink-3:#6C7568;
  --lima:#C6F432; --lima-2:#8FCB1C; --lima-ink:#0B0D0A;
  --lima-s:rgba(198,244,50,.12); --lima-g:rgba(198,244,50,.26);
  --e:#6EC1FF; --e-s:rgba(110,193,255,.13);
  --o:#FFB23E; --o-s:rgba(255,178,62,.13);
  --a:#C6F432; --a-s:rgba(198,244,50,.13);
  --n:#8C9587; --n-s:rgba(140,149,135,.14);
  --rojo:#FF5B57; --rojo-s:rgba(255,91,87,.13);
  --r:22px; --r-2:16px;
  --sombra:0 18px 40px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Manrope, "MiSans", system-ui, "Segoe UI", Roboto, sans-serif;
  font-size:14px; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--lima); outline-offset:2px; border-radius:8px}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.lbl{font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}

/* ===== armazón ================================================================== */
.app{min-height:100dvh}
.main{
  max-width:560px; margin:0 auto;
  padding-left:16px; padding-right:16px;
  padding-block:calc(18px + env(safe-area-inset-top)) calc(104px + env(safe-area-inset-bottom));
}

/* barra inferior al estilo Android (HyperOS / Material) */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; align-items:center; justify-content:space-around;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(11,13,10,.86); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.nav .marca{display:none}
.nv{
  flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; border-radius:14px; color:var(--ink-3);
  font-size:10.5px; font-weight:600; letter-spacing:.01em;
}
.nv svg{flex:none}
.nv[aria-current="page"]{color:var(--lima)}
.nv[aria-current="page"] .nv-i{background:var(--lima-s)}
.nv-i{display:grid; place-items:center; width:46px; height:28px; border-radius:99px; transition:background .2s}
.nv.mas{flex:0 0 auto; margin-top:-26px}
.nv.mas .nv-i{
  width:58px; height:58px; border-radius:20px; background:var(--lima); color:var(--lima-ink);
  box-shadow:0 10px 28px -8px rgba(198,244,50,.55), 0 0 0 6px var(--bg);
}
.nv.mas > span:last-child{display:none}

/* ===== cabecera ================================================================ */
.cab{display:grid; gap:14px; margin-bottom:18px}
.hola{margin:0; font-size:13px; font-weight:600; color:var(--ink-2)}
.cab h1{
  margin:2px 0 0; font-size:27px; line-height:1.08; font-weight:800; letter-spacing:-.035em;
  text-wrap:balance;
}
.mesbar{
  display:inline-flex; align-items:center; gap:2px; justify-self:start;
  background:var(--card); border:1px solid var(--line); border-radius:99px; padding:3px;
}
.mesbar span{padding:0 8px; font-size:13px; font-weight:700; white-space:nowrap}
.mesbar span::first-letter{text-transform:uppercase}
.ico{display:grid; place-items:center; width:34px; height:34px; border-radius:99px; color:var(--ink-2)}
.ico:hover{background:var(--card-2); color:var(--ink)}

/* ===== tarjetas ================================================================ */
.card{
  position:relative; overflow:hidden;
  background:linear-gradient(180deg, #151912 0%, #10130E 100%);
  border:1px solid var(--line); border-radius:var(--r);
}
.isq{
  display:grid; place-items:center; flex:none; width:34px; height:34px; border-radius:11px;
  background:var(--lima-s); color:var(--lima);
}
.isq.c-e{background:var(--e-s); color:var(--e)}
.isq.c-o{background:var(--o-s); color:var(--o)}
.isq.c-a{background:var(--a-s); color:var(--a)}
.isq.c-n{background:var(--n-s); color:var(--n)}
.pill{
  display:inline-block; padding:5px 11px; border-radius:99px;
  background:var(--card-3); border:1px solid var(--line-2);
  font-size:11px; font-weight:700; color:var(--ink-2); white-space:nowrap;
}
.pill::first-letter{text-transform:uppercase}

/* rejilla de inicio: una columna en el móvil, la del reel en escritorio */
.ig{display:grid; gap:12px}

/* la tarjeta protagonista, con el resplandor lima del reel */
.hero{padding:18px 18px 16px; box-shadow:var(--sombra)}
.hero::before{
  content:""; position:absolute; pointer-events:none;
  top:-46%; right:-26%; width:78%; aspect-ratio:1;
  background:radial-gradient(circle, var(--lima-g) 0%, rgba(198,244,50,.06) 42%, transparent 68%);
}
.hero > *{position:relative}
.hero-head{display:flex; align-items:center; gap:11px}
.hero-head > span:nth-child(2){flex:1; min-width:0; display:grid; gap:1px}
.hero-head b{font-size:14px; font-weight:700}
.hero-num{
  margin:18px 0 16px; font-size:44px; line-height:1; font-weight:800; letter-spacing:-.045em;
}
.hero-num .cent{font-size:.5em; letter-spacing:-.02em; color:var(--ink-2); font-weight:700}
.hero-num.neg{color:var(--rojo)}

.cmp{display:grid; gap:11px; padding:14px; border-radius:var(--r-2);
  background:rgba(8,10,7,.55); border:1px solid var(--line)}
.cmp-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  font-size:12.5px; font-weight:700}
.cmp-f{display:grid; grid-template-columns:62px 1fr auto; align-items:center; gap:10px}
.cmp-n{font-size:12px; color:var(--ink-2); font-weight:600}
.cmp-bar{height:8px; border-radius:99px; background:var(--card-3); overflow:hidden}
.cmp-bar i{display:block; height:100%; border-radius:99px}
.cmp-bar i.in{background:linear-gradient(90deg, var(--lima-2), var(--lima))}
.cmp-bar i.out{background:linear-gradient(90deg, #C9403D, var(--rojo))}
.cmp-v{font-size:12.5px; font-weight:700; min-width:76px; text-align:right}
.cmp-v.in{color:var(--lima)}
.cmp-v.out{color:var(--rojo)}
.hero-pie{display:flex; justify-content:space-between; gap:10px; margin-top:12px;
  font-size:11.5px; color:var(--ink-3); font-weight:600}
.hero-pie .dot{display:inline-block; width:7px; height:7px; border-radius:99px;
  background:var(--lima); margin-right:7px; vertical-align:1px; box-shadow:0 0 10px var(--lima)}

/* patrimonio y cuentas */
.ig-side{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tile{display:grid; gap:4px; padding:14px; text-align:left; align-content:start}
.tile .isq{width:30px; height:30px; border-radius:10px; margin-bottom:6px}
.tile b{font-size:19px; font-weight:800; letter-spacing:-.03em; line-height:1.1}
.tile-pie{font-size:11px; color:var(--ink-3); font-weight:500; line-height:1.3}
.tile::after{
  content:""; position:absolute; right:-30%; bottom:-60%; width:80%; aspect-ratio:1; pointer-events:none;
  background:radial-gradient(circle, rgba(198,244,50,.09), transparent 65%);
}

/* títulos de sección */
.sec-t{display:flex; justify-content:space-between; align-items:baseline; margin:10px 2px 0;
  font-size:15px; font-weight:800; letter-spacing:-.02em}

/* los tres sobres */
.sobres{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.sobre{display:flex; flex-direction:column; gap:7px; padding:13px 11px 12px; text-align:left; border-radius:18px}
.s-top{display:flex; justify-content:space-between; align-items:center}
.s-pct{font-size:11px; font-weight:800; color:var(--c)}
.s-ok{display:grid; place-items:center; width:20px; height:20px; border-radius:99px;
  background:var(--lima); color:var(--lima-ink)}
.s-nom{font-size:11.5px; font-weight:700; color:var(--ink-2); margin-top:-3px}
.s-rest{font-size:18px; font-weight:800; letter-spacing:-.035em; line-height:1}
.s-rest.neg{color:var(--rojo)}
.s-sub{font-size:10px; color:var(--ink-3); font-weight:600; line-height:1.25}
.s-sub.hecho{color:var(--lima)}
.s-sub.falta{color:var(--rojo)}
.s-e{--c:var(--e)} .s-o{--c:var(--o)} .s-a{--c:var(--a)}
.sobre.s-a.ok{border-color:rgba(198,244,50,.35)}

.bar{display:flex; height:6px; border-radius:99px; background:var(--card-3); overflow:hidden}
.bar i{display:block; height:100%}
.bar .fill{background:var(--c, var(--lima))}
.bar .fill.over{background:var(--rojo)}
.bar .apart{background:var(--c, var(--lima)); opacity:.6}
.bar .pend{background:var(--c, var(--lima)); opacity:.28}
.bar.lima .fill{background:linear-gradient(90deg, var(--lima-2), var(--lima))}

/* paneles con cabecera y "Ver todos" */
.panel{padding:16px}
.ph{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.ph-t{display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:800; letter-spacing:-.015em}
.ph-t .isq{width:30px; height:30px; border-radius:10px}
.vt{font-size:12px; font-weight:700; color:var(--lima); padding:6px 4px}

/* objetivos */
.gm{padding:12px 0; border-top:1px solid var(--line)}
.gm:first-of-type{border-top:0; padding-top:2px}
.gm-h{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.gm-n{font-size:13.5px; font-weight:700}
.gm-p{font-size:12px; font-weight:800; color:var(--lima)}
.gm-v{margin:3px 0 8px; font-size:17px; font-weight:800; letter-spacing:-.03em}
.gm-v em{font-style:normal; font-size:12px; color:var(--ink-3); font-weight:600; letter-spacing:0}
.gm-pie{margin-top:7px; font-size:11.5px; color:var(--ink-3); font-weight:500}
.gm-pie .hecha{color:var(--lima); font-weight:700}

/* filas de movimiento */
.filas{display:grid}
.fm{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 0;
  border-top:1px solid var(--line)}
.fm:first-child{border-top:0}
.card.filas{padding:4px 14px}
.fm-t{flex:1; min-width:0; display:grid; gap:2px}
.fm-t b{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fm-t b::first-letter{text-transform:uppercase}
.fm-t small{font-size:11px; color:var(--ink-3); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fm-v{font-size:13.5px; font-weight:800; letter-spacing:-.01em; flex:none}
.fm-v.neg{color:var(--rojo)} .fm-v.pos{color:var(--lima)} .fm-v.neu{color:var(--ink-2)}

/* compromisos pendientes */
.pend-r{display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.pend-r:first-of-type{border-top:0; padding-top:0}
.pend-r .fm-t b{font-size:13px}
.mini-btn{flex:none; padding:7px 12px; border-radius:99px; font-size:11.5px; font-weight:700;
  background:var(--card-3); border:1px solid var(--line-2); color:var(--ink)}
.mini-btn:hover{border-color:var(--lima); color:var(--lima)}

.vacio-p{margin:0; padding:6px 0 4px; color:var(--ink-3); font-size:13px; line-height:1.5}

/* bienvenida (sin datos) */
.bienvenida{padding:22px 20px 20px}
.bienvenida h2{margin:16px 0 6px; font-size:22px; font-weight:800; letter-spacing:-.03em}
.bienvenida p{margin:0 0 18px; color:var(--ink-2); font-size:13.5px; line-height:1.55; max-width:40ch}
.enlace{font-size:12.5px; font-weight:700; color:var(--lima); padding:8px 0 0}

/* ===== movimientos ============================================================ */
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 4px; margin:0 -16px 14px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-f{flex:none; padding:8px 14px; border-radius:99px; font-size:12.5px; font-weight:700;
  background:var(--card); border:1px solid var(--line); color:var(--ink-2)}
.chip-f[aria-pressed="true"]{background:var(--lima); border-color:var(--lima); color:var(--lima-ink)}
.dia{margin-bottom:14px}
.dia-h{display:flex; justify-content:space-between; align-items:baseline; margin:0 4px 7px;
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.dia-h span:first-child::first-letter{text-transform:uppercase}
.vacio{padding:34px 20px; text-align:center; color:var(--ink-3); font-size:13.5px; line-height:1.55}

/* ===== análisis =============================================================== */
.rep{display:grid; gap:14px}
.rep-f{display:grid; gap:7px}
.rep-h{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:700}
.rep-h em{font-style:normal; font-size:12px; color:var(--ink-3); font-weight:600}
.rep-h b{font-size:15px; font-weight:800; color:var(--c)}
.rep-bar{position:relative; height:10px; border-radius:99px; background:var(--card-3)}
.rep-bar i{position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--c)}
.rep-bar i.over{background:var(--rojo)}
.rep-bar u{position:absolute; top:-4px; bottom:-4px; width:2px; border-radius:2px; background:var(--ink); opacity:.75}
.nota-r{margin:4px 0 0; font-size:12.5px; color:var(--ink-2); line-height:1.5}
.nota-r b{color:var(--ink)}
.nota-r.mal{color:var(--rojo)}
.lista-r{display:grid}
.lr{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.lr .fm-t b{font-size:13.5px}
.lr-v{font-size:14px; font-weight:800; flex:none}
.lr-v.neg{color:var(--rojo)}
.lr.total{border-top:1px solid var(--line-2); margin-top:2px}
.lr.total .fm-t b{font-weight:800}

/* ===== pie ===================================================================== */
.sync{margin:22px 0 0; text-align:center; font-size:11px; color:var(--ink-3); line-height:1.5}
.sync b{color:var(--ink-2)}

/* ===== aviso tipo Android (snackbar) =========================================== */
.snack{
  position:fixed; z-index:60; left:16px; right:16px; margin:0 auto; max-width:520px;
  bottom:calc(92px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:14px;
  background:#E9EEE2; color:#101410; font-size:13px; font-weight:600;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.7);
}
.snack button{margin-left:auto; flex:none; font-weight:800; color:#4E7A06; font-size:13px; letter-spacing:.02em}

/* ===== hojas (movimiento completo y ajustes) =================================== */
dialog:not(.qa){
  border:0; padding:0; background:transparent; max-width:560px; width:100%;
  margin:auto auto 0; max-height:92dvh; color:var(--ink);
}
dialog:not(.qa)::backdrop{background:rgba(0,0,0,.66)}
.hoja{
  background:var(--bg-2); border:1px solid var(--line); border-bottom:0;
  border-radius:26px 26px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:92dvh; overflow-y:auto;
}
.tirador{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:0 auto 14px}
.hoja h2{margin:0 0 16px; font-size:18px; font-weight:800; letter-spacing:-.02em}
.hoja h2 .ico{float:right; margin:-6px -8px 0 0}

.campo{display:grid; gap:6px; margin-bottom:12px}
.campo > label{font-size:12px; font-weight:700; color:var(--ink-2)}
input, select, textarea{
  font:inherit; font-size:15px; font-weight:600; width:100%; padding:12px 13px;
  background:var(--card); color:var(--ink); border:1px solid var(--line-2); border-radius:13px;
}
input:focus, select:focus{outline:none; border-color:var(--lima)}
input::placeholder{color:var(--ink-3); font-weight:500}
.importe input{font-size:32px; font-weight:800; text-align:center; letter-spacing:-.03em; padding:14px}
.fila2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.seg{display:grid; grid-auto-flow:column; gap:4px; background:var(--card); padding:4px;
  border-radius:14px; border:1px solid var(--line)}
.seg button{padding:9px 4px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--lima); color:var(--lima-ink)}
.check{display:flex; align-items:center; gap:10px; font-size:13px; margin-bottom:12px; cursor:pointer; color:var(--ink-2)}
.check input{width:19px; height:19px; flex:none; accent-color:var(--lima)}
.acciones{display:flex; gap:9px; margin-top:8px}
.btn{
  flex:1; border-radius:15px; padding:14px; font-size:14.5px; font-weight:800; letter-spacing:-.01em;
  background:var(--lima); color:var(--lima-ink);
}
.btn:disabled{opacity:.35; cursor:default}
.btn.sec{background:var(--card-2); color:var(--ink); border:1px solid var(--line-2); flex:0 0 auto; padding-inline:18px}
.btn.del{background:var(--rojo-s); color:var(--rojo); border:1px solid rgba(255,91,87,.45); flex:0 0 auto; padding-inline:18px}
.nota{font-size:12px; color:var(--ink-3); line-height:1.5; margin:-4px 0 14px}
.nota b{color:var(--ink-2)}
.chip{display:inline-block; padding:2px 7px; border-radius:99px; font-size:10px; font-weight:700;
  background:var(--card-3); color:var(--ink-2)}

.tabs{display:flex; gap:3px; background:var(--card); padding:4px; border-radius:14px; margin-bottom:16px;
  border:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto; white-space:nowrap; padding:9px 12px; border-radius:10px;
  font-size:12px; font-weight:700; color:var(--ink-3)}
.tabs button[aria-pressed="true"]{background:var(--card-3); color:var(--lima)}
.listaed{display:grid; gap:8px; margin-bottom:12px}
.item{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
  border-radius:15px; padding:11px 12px}
.item .g{flex:1; min-width:0}
.item .g b{display:block; font-size:13.5px; font-weight:700}
.item .g span{display:block; font-size:11px; color:var(--ink-3); margin-top:2px}
.item .im{font-size:13px; font-weight:800; flex:none}
.item .x{color:var(--ink-3); padding:5px; border-radius:8px; flex:none}
.item .x:hover{color:var(--rojo); background:var(--rojo-s)}
.item input, .item select{background:var(--bg-2)}
.ord{display:flex; flex-direction:column; gap:3px; flex:none}
.ord button{border:1px solid var(--line-2); background:var(--card-2); color:var(--ink-2);
  border-radius:7px; padding:2px 6px; font-size:10px; line-height:1.4}
.ord button:disabled{opacity:.3}
.add{width:100%; border:1px dashed var(--line-2); color:var(--ink-2); border-radius:14px;
  padding:12px; font-size:13px; font-weight:700}
.add:hover{border-color:var(--lima); color:var(--lima)}
.pcts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pcts .campo{margin:0}
.sum{font-size:12px; font-weight:700; margin-top:8px}
.sum.bad{color:var(--rojo)} .sum.good{color:var(--lima)}
.tope{font-size:12px; font-weight:700; margin:-4px 0 12px; color:var(--ink-2)}
.tope.mal{color:var(--rojo)}
.sec-dat{margin:4px 0 8px; font-size:14px; font-weight:800; letter-spacing:-.01em}
.sec-dat.sep{margin-top:22px; padding-top:18px; border-top:1px solid var(--line)}
.hist{display:grid; gap:6px; margin-bottom:10px}
.hist-f{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:13px;
  background:var(--card); border:1px solid var(--line)}
.hist-f .fm-t b{font-size:12.5px; white-space:normal}
.hist-f.viejo{opacity:.55}
.peligro{margin-top:22px; padding:14px; border-radius:16px; border:1px solid rgba(255,91,87,.35); background:var(--rojo-s)}
.peligro b{display:block; font-size:13.5px; margin-bottom:4px}

<script>
(function(){
"use strict";

/* ============================ modelo ============================ */

var BUCKETS = {
  e:{id:"e", nom:"Esenciales", desc:"Vivienda, comida, transporte, salud", verbo:"Gastado"},
  o:{id:"o", nom:"Ocio", desc:"Restaurantes, ropa, caprichos, viajes", verbo:"Gastado"},
  a:{id:"a", nom:"Ahorro", desc:"Fondo de emergencia e inversión", verbo:"Ahorrado"}
};

var CATS_DEF = [
  {id:"alquiler", nom:"Alquiler / Hipoteca", b:"e"},
  {id:"super",    nom:"Supermercado",        b:"e"},
  {id:"transp",   nom:"Transporte",          b:"e"},
  {id:"gym",      nom:"Gimnasio",            b:"e"},
  {id:"sumin",    nom:"Luz, agua, gas",      b:"e"},
  {id:"tele",     nom:"Móvil e internet",    b:"e"},
  {id:"salud",    nom:"Salud y farmacia",    b:"e"},
  {id:"seguros",  nom:"Seguros",             b:"e"},
  {id:"otroe",    nom:"Otros esenciales",    b:"e"},
  {id:"resta",    nom:"Restaurantes y bares",b:"o"},
  {id:"ocio",     nom:"Ocio y fiesta",       b:"o"},
  {id:"ropa",     nom:"Ropa",                b:"o"},
  {id:"subs",     nom:"Suscripciones",       b:"o"},
  {id:"viajes",   nom:"Viajes",              b:"o"},
  {id:"capri",    nom:"Caprichos",           b:"o"},
  {id:"otroo",    nom:"Otros ocio",          b:"o"},
  {id:"emerg",    nom:"Fondo de emergencia", b:"a"},
  {id:"invers",   nom:"Inversión",           b:"a"},
  {id:"ahorro",   nom:"Ahorro general",      b:"a"}
];

var CUENTAS_DEF = [
  {id:"sab", nom:"Sabadell",       rol:"ingresos", inicial:0},
  {id:"tr",  nom:"Trade Republic", rol:"gasto",    inicial:0},
  {id:"ob",  nom:"Openbank",       rol:"ahorro",   inicial:0},
  {id:"efe", nom:"Efectivo",       rol:"efectivo", inicial:0}
];

var ROLES = {ingresos:"Entra la nómina", gasto:"Gasto diario", ahorro:"Ahorro",
             efectivo:"Efectivo", otro:"Otra"};

var CONFIG_DEF = {
  ingresoBase: 0,
  pct: {e:50, o:30, a:20},
  metas: [],
  cuentas: CUENTAS_DEF,
  categorias: CATS_DEF,
  fijos: []
};

/* ============================ utilidades ============================ */

var eur = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
var eur0 = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
function money(n){ return eur.format(n||0); }
function money0(n){ return Math.abs(n) >= 1000 ? eur0.format(n||0) : eur.format(n||0); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
function mesId(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function mesDesde(id){ var p=id.split("-"); return new Date(+p[0], +p[1]-1, 1); }
function mesAnterior(id){ var d=mesDesde(id); d.setMonth(d.getMonth()-1); return mesId(d); }
function nombreMes(id){
  var d=mesDesde(id);
  return d.toLocaleDateString("es-ES",{month:"long", year:"numeric"});
}
function hoyISO(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fechaLarga(iso){
  var p=iso.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long"});
}
function diasDelMes(id){ var d=mesDesde(id); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }

/* ============================ almacenamiento ============================ */
/* Nube (capacidad db) como fuente de verdad + copia local para abrir al
   instante y seguir funcionando sin cobertura. */

var almacen = {
  db: null,
  estado: "local",
  subs: [],

  local: function(clave){
    try{ var v = localStorage.getItem("tresobres:"+clave); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  },
  guardarLocal: function(clave, datos){
    try{ localStorage.setItem("tresobres:"+clave, JSON.stringify(datos)); }catch(e){}
  },

  conectar: function(alCambiar){
    var self = this;
    if (!window.claude || !window.claude.use) return;
    window.claude.use("db").then(function(db){
      if (!db) return;
      self.db = db;
      self.estado = "nube";
      alCambiar();
    }).catch(function(){});
  },

  suscribir: function(ruta, clave, cb){
    var self = this;
    if (!this.db) return function(){};
    try{
      return this.db.doc(ruta).onSnapshot(function(snap){
        var datos = snap.exists ? snap.data() : null;
        if (datos) self.guardarLocal(clave, datos);
        cb(datos);
      }, function(){ self.estado = "local"; render(); });
    }catch(e){ return function(){}; }
  },

  escribir: function(ruta, clave, datos){
    this.guardarLocal(clave, datos);
    if (!this.db) return;
    try{ this.db.doc(ruta).set(datos).catch(function(){}); }catch(e){}
  }
};

/* ============================ estado ============================ */

var S = {
  mes: mesId(new Date()),
  config: null,
  meses: {},        // {"2026-09": {movimientos:[...]}}
  filtro: null,     // "e" | "o" | "a" | null
  desub: []
};

function cfg(){ return S.config || CONFIG_DEF; }

// La versión anterior guardaba una sola meta con aportación mensual.
// Se convierte en la primera de la lista y se olvida la aportación: ahora
// lo que cuenta es lo que se aporta de verdad, no lo que se prometió.
var configMigrada = false;

function normalizarConfig(c){
  configMigrada = false;
  if (!c) return c;
  if (!c.metas) c.metas = [];
  if (c.meta && +c.meta.objetivo > 0){
    c.metas.push({id: uid(), nombre: c.meta.nombre || "Ahorro especial",
                  objetivo: +c.meta.objetivo || 0,
                  aportacion: +c.meta.aportacion || 0});
  }
  // Hay que guardar la conversión en cuanto ocurre: el id de la meta se
  // genera al vuelo, y si no se persiste saldría uno distinto en cada
  // carga, dejando huérfanas las aportaciones que apuntaban al anterior.
  if (c.meta !== undefined || c.rollover !== undefined) configMigrada = true;

  // El efectivo también es tu dinero: si no hay una cuenta para él, se crea.
  c.cuentas = c.cuentas || [];
  var hayEfectivo = false;
  for (var q = 0; q < c.cuentas.length; q++){
    if (c.cuentas[q].inicial === undefined) c.cuentas[q].inicial = 0;
    if (c.cuentas[q].rol === "efectivo") hayEfectivo = true;
  }
  if (!hayEfectivo){
    c.cuentas.push({id: "efe", nom: "Efectivo", rol: "efectivo", inicial: 0});
    configMigrada = true;
  }
  delete c.meta;
  delete c.rollover;
  return c;
}

function metaPorId(id){
  var l = cfg().metas || [];
  for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
  return null;
}
function movs(id){ var m = S.meses[id]; return (m && m.movimientos) || []; }
function cat(id){
  var l = cfg().categorias;
  for (var i=0;i<l.length;i++) if (l[i].id===id) return l[i];
  return {id:id, nom:"Sin categoría", b:"e"};
}
function cuenta(id){
  var l = cfg().cuentas;
  for (var i=0;i<l.length;i++) if (l[i].id===id) return l[i];
  return {id:id, nom:"—", rol:"otro"};
}
function cuentaPorRol(rol){
  var l = cfg().cuentas;
  for (var i=0;i<l.length;i++) if (l[i].rol===rol) return l[i];
  return null;
}

/* ============================ cálculo ============================ */

function calcular(id){
  var c = cfg();
  var lista = movs(id);
  var extra = 0, i, m;

  for (i=0;i<lista.length;i++) if (lista[i].tipo==="ingreso") extra += (+lista[i].importe||0);

  var base = (+c.ingresoBase||0) + extra;

  var asignado = asignadoMes(id);

  // Los sobres son SIEMPRE el porcentaje del ingreso. Lo que sobra a fin
  // de mes no engorda ninguna asignación: se convierte en ahorro, que es
  // justo lo que significa ahorrar.

  var gastado = {e:0,o:0,a:0};
  for (i=0;i<lista.length;i++){
    m = lista[i];
    if (m.tipo !== "gasto") continue;
    var b = cat(m.cat).b;
    gastado[b] += (+m.importe||0);
  }

  // compromisos pendientes: gastos fijos que aún no se han registrado este mes
  var pagados = {};
  for (i=0;i<lista.length;i++) if (lista[i].fijoId) pagados[lista[i].fijoId] = true;
  var comprometido = {e:0,o:0,a:0}, pendientes = [];
  for (i=0;i<(c.fijos||[]).length;i++){
    var f = c.fijos[i];
    if (pagados[f.id]) continue;
    comprometido[cat(f.cat).b] += (+f.importe||0);
    pendientes.push(f);
  }

  // El sobre de ahorro se cumple moviendo el dinero a la cuenta de ahorro.
  // Cuenta el neto: lo que entra suma y lo que sacas resta, de modo que una
  // retirada desmarca el mes ella sola.
  var cAhorro = cuentaPorRol("ahorro");
  var traspasado = 0;
  if (cAhorro){
    for (i = 0; i < lista.length; i++){
      m = lista[i];
      if (m.tipo !== "traspaso") continue;
      if (m.destino === cAhorro.id) traspasado += (+m.importe || 0);
      else if (m.cuenta === cAhorro.id) traspasado -= (+m.importe || 0);
    }
  }

  // Lo aportado a las metas sale del ocio y, si no llega, de hasta un 10%
  // del sobre de ahorro. De esenciales no sale nada nunca.
  var aportado = metasDelMes(id);
  var tope = topeMetas(asignado);
  var apartado = {e: 0, o: Math.min(aportado, tope.ocio), a: 0};
  apartado.a = Math.min(aportado - apartado.o, tope.ahorro);

  // Lo que ya está cubierto del sobre de ahorro: lo traspasado más lo que
  // hayas registrado como gasto de categoría de ahorro.
  var objetivoAhorro = Math.max(0, asignado.a - apartado.a);
  var cubiertoAhorro = traspasado + gastado.a;

  return {
    base: base, extra: extra,
    asignado: asignado, gastado: gastado, apartado: apartado,
    comprometido: comprometido, pendientes: pendientes,
    fijosPagados: pagados,
    traspasado: traspasado, objetivoAhorro: objetivoAhorro,
    cubiertoAhorro: cubiertoAhorro,
    ahorroHecho: objetivoAhorro > 0 && cubiertoAhorro >= objetivoAhorro - 0.005
  };
}

var PREFIJO_MES = "tresobres:mes:";

// Todos los meses que conocemos, no solo los dos que hay cargados.
function mesesConocidos(){
  var out = {};
  try{
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (k && k.indexOf(PREFIJO_MES) === 0){
        out[k.slice(PREFIJO_MES.length)] = JSON.parse(localStorage.getItem(k));
      }
    }
  }catch(e){}
  Object.keys(S.meses).forEach(function(id){ if (!out[id]) out[id] = S.meses[id]; });
  return out;
}

// Reparte un mes en: lo que entro, lo gastado de verdad y lo apartado.
//
// Mover dinero al sobre de ahorro NO es gastarlo: cambia de sitio y sigue
// siendo tuyo. Por eso solo restan esenciales y ocio.
function balanceMes(lista){
  var extra = 0, gasto = 0, ahorro = 0;
  (lista || []).forEach(function(m){
    var v = +m.importe || 0;
    if (m.tipo === "ingreso") extra += v;
    else if (m.tipo === "gasto"){
      if (cat(m.cat).b === "a") ahorro += v; else gasto += v;
    }
  });
  return {extra: extra, gasto: gasto, ahorro: ahorro};
}

// Lo que un mes deja ahorrado en total: lo que entró menos lo gastado de
// verdad. Incluye el 20% obligatorio y lo que sobró de los otros dos sobres.
function ahorradoMes(lista, base){
  var b = balanceMes(lista);
  return (base + b.extra) - b.gasto;
}

// Lo que sobró de esenciales y ocio en un mes. El 20% no cuenta aquí: ese
// ya era ahorro por definición. Esto es lo ahorrado de más.
function sobranteMes(id){
  var lista = movs(id);
  if (!lista.length) return 0;
  var c = cfg(), b = balanceMes(lista);
  var ingreso = (+c.ingresoBase || 0) + b.extra;
  return ingreso * ((c.pct.e||0) + (c.pct.o||0)) / 100 - b.gasto;
}

// Dónde está tu dinero ahora mismo, cuenta por cuenta. Parte del saldo
// inicial que declaraste y aplica todo lo registrado desde entonces.
//
// La nómina se imputa a la cuenta con rol Ingresos en cada mes con actividad,
// porque no se registra como movimiento. Las aportaciones a metas no se restan:
// reservan dinero, no lo sacan de la cuenta.
function saldos(){
  var c = cfg();
  var mapa = {};
  (c.cuentas || []).forEach(function(x){ mapa[x.id] = +x.inicial || 0; });

  var cIng = cuentaPorRol("ingresos");
  var meses = mesesConocidos();

  Object.keys(meses).forEach(function(id){
    var lista = (meses[id] && meses[id].movimientos) || [];
    if (!lista.length) return;
    if (cIng && mapa[cIng.id] !== undefined) mapa[cIng.id] += (+c.ingresoBase || 0);

    lista.forEach(function(m){
      var v = +m.importe || 0;
      if (m.tipo === "ingreso"){
        if (mapa[m.cuenta] !== undefined) mapa[m.cuenta] += v;
      } else if (m.tipo === "gasto"){
        if (mapa[m.cuenta] !== undefined) mapa[m.cuenta] -= v;
      } else if (m.tipo === "traspaso"){
        if (mapa[m.cuenta] !== undefined) mapa[m.cuenta] -= v;
        if (mapa[m.destino] !== undefined) mapa[m.destino] += v;
      }
    });
  });

  var lista = (c.cuentas || []).map(function(x){
    return {id: x.id, nom: x.nom, rol: x.rol, saldo: mapa[x.id] || 0};
  });
  var total = 0;
  lista.forEach(function(x){ total += x.saldo; });
  return {cuentas: lista, total: total};
}

// Lo que ya tenías antes de empezar a usar la app.
function saldoInicialTotal(){
  var t = 0;
  (cfg().cuentas || []).forEach(function(x){ t += +x.inicial || 0; });
  return t;
}

// Todos los ahorros acumulados, mes a mes.
function ahorroTotal(){
  var meses = mesesConocidos();
  var base = +cfg().ingresoBase || 0;
  var total = 0, obligatorio = 0, usados = 0;

  Object.keys(meses).forEach(function(id){
    var lista = (meses[id] && meses[id].movimientos) || [];
    if (!lista.length) return;   // mes sin estrenar: no inventamos una nómina
    var b = balanceMes(lista);
    total += ahorradoMes(lista, base);
    obligatorio += (base + b.extra) * (cfg().pct.a || 0) / 100;
    usados++;
  });

  var inicial = saldoInicialTotal();
  return {total: total + inicial, inicial: inicial, obligatorio: obligatorio,
          demas: total - obligatorio, meses: usados};
}

// Los tres sobres de un mes, siempre el porcentaje exacto del ingreso.
function asignadoMes(id){
  var c = cfg(), b = balanceMes(movs(id));
  var base = (+c.ingresoBase || 0) + b.extra;
  return {e: base*(c.pct.e||0)/100, o: base*(c.pct.o||0)/100, a: base*(c.pct.a||0)/100};
}

// Tope que pueden absorber las metas en un mes: todo el ocio y un 10% del
// sobre de ahorro. De esenciales, nada. Nunca.
function topeMetas(asignado){
  var a = asignado || asignadoMes(S.mes);
  return {ocio: a.o, ahorro: a.a * 0.10, total: a.o + a.a * 0.10};
}

// Lo aportado a metas en un mes (las retiradas van en negativo y liberan).
function metasDelMes(id){
  var t = 0;
  movs(id).forEach(function(m){ if (m.tipo === "meta") t += (+m.importe || 0); });
  return t;
}

// Cuánto más se puede destinar a metas este mes sin saltarse el tope.
function margenMetas(id){
  return Math.max(0, topeMetas(asignadoMes(id)).total - metasDelMes(id));
}

// Estado de cada meta, en orden de prioridad. Lo acumulado son aportaciones
// reales; el ritmo y la fecha salen de lo que de verdad has ido apartando,
// no de lo que dijiste que aportarías.
function estadoMetas(){
  var defs = cfg().metas || [];
  if (!defs.length) return [];

  var acum = {}, primer = {};
  var meses = mesesConocidos();
  Object.keys(meses).sort().forEach(function(id){
    ((meses[id] && meses[id].movimientos) || []).forEach(function(mv){
      if (mv.tipo !== "meta" || !mv.metaId) return;
      acum[mv.metaId] = (acum[mv.metaId] || 0) + (+mv.importe || 0);
      if (!primer[mv.metaId]) primer[mv.metaId] = id;
    });
  });

  var hoy = new Date();
  return defs.map(function(m, i){
    var obj = +m.objetivo || 0;
    var tiene = acum[m.id] || 0;
    var restante = Math.max(0, obj - tiene);
    var previsto = +m.aportacion || 0;
    var real = 0;

    // Si ya has aportado, manda tu ritmo real: describe lo que haces, no lo
    // que dijiste que harías. Mientras no haya nada, se proyecta con lo previsto.
    if (primer[m.id] && tiene > 0){
      var ini = mesDesde(primer[m.id]);
      var n = (hoy.getFullYear()-ini.getFullYear())*12 + (hoy.getMonth()-ini.getMonth()) + 1;
      if (n < 1) n = 1;
      real = tiene / n;
    }

    var ritmo = real > 0 ? real : previsto;
    var faltan = null, fecha = null;
    if (ritmo > 0 && restante > 0){
      faltan = Math.ceil(restante / ritmo);
      var f = new Date(hoy.getFullYear(), hoy.getMonth() + faltan, 1);
      fecha = f.toLocaleDateString("es-ES", {month:"long", year:"numeric"});
    }

    return {id: m.id, nombre: m.nombre, prioridad: i + 1, objetivo: obj,
            acumulado: tiene, restante: restante,
            ritmo: ritmo, previsto: previsto, real: real,
            esPrevision: !(real > 0) && previsto > 0,
            faltan: faltan, fecha: fecha,
            pct: obj > 0 ? Math.min(100, Math.max(0, tiene / obj * 100)) : 0};
  });
}

function ico(n, t){
  t = t || 20;
  return '<svg width="' + t + '" height="' + t + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
         (ICONOS[n] || ICONOS.cartera) + '</svg>';
}

var ICONO_CAT = {alquiler:"casa", super:"carrito", transp:"bus", gym:"pesa", sumin:"rayo", tele:"movil",
  salud:"salud", seguros:"escudo", otroe:"casa", resta:"plato", ocio:"copa", ropa:"camiseta",
  subs:"tele", viajes:"avion", capri:"regalo", otroo:"copa", emerg:"hucha", invers:"grafica", ahorro:"hucha"};

function icoCat(id){
  if (ICONO_CAT[id]) return ICONO_CAT[id];
  var b = cat(id).b;
  return b === "e" ? "casa" : b === "o" ? "copa" : "hucha";
}

function icoCuenta(x){
  return x.rol === "efectivo" ? "billete" : x.rol === "ahorro" ? "hucha" : "banco";
}

// La cifra grande con los céntimos en pequeño, como en el reel.
function moneyBig(n){
  var s = money(n), i = s.lastIndexOf(",");
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<span class="cent">' + esc(s.slice(i)) + '</span>';
}

function ordenMovs(a, b){
  return a.fecha === b.fecha ? (b.creado || 0) - (a.creado || 0) : (a.fecha < b.fecha ? 1 : -1);
}

function fechaCorta(iso){
  var p = iso.split("-");
  return (+p[2]) + " " + MESES_C[+p[1] - 1];
}

// Cómo se pinta cada movimiento, sea del tipo que sea.
function descMov(m){
  var v = +m.importe || 0;
  if (m.tipo === "ingreso")
    return {b: "a", icono: "sube", etiqueta: "Ingreso", signo: "+" + money(v), clase: "pos", donde: cuenta(m.cuenta).nom};
  if (m.tipo === "traspaso")
    return {b: "n", icono: "flechas", etiqueta: "Traspaso", signo: money(v), clase: "neu",
            donde: cuenta(m.cuenta).nom + " → " + cuenta(m.destino).nom};
  if (m.tipo === "meta"){
    var mm = metaPorId(m.metaId);
    return {b: "o", icono: "objetivo", etiqueta: mm ? mm.nombre : "Meta borrada",
            signo: (v < 0 ? "↩ " + money(-v) : "→ " + money(v)), clase: "neu", donde: cuenta(m.cuenta).nom};
  }
  var ct = cat(m.cat);
  return {b: ct.b, icono: icoCat(m.cat), etiqueta: ct.nom,
          signo: v < 0 ? "+" + money(-v) : "−" + money(v), clase: v < 0 ? "pos" : "neg",
          donde: cuenta(m.cuenta).nom};
}

function tarjetaSobre(k, b){
  var B = BUCKETS[b];
  var asig = k.asignado[b], gas = k.gastado[b], comp = k.comprometido[b];
  var apa = (k.apartado && k.apartado[b]) || 0;
  var rest, pGas, pApa, pComp, over, sub, clase = "";

  if (b === "a"){
    // El ahorro no se gasta: se cumple moviendo el dinero a la cuenta de ahorro.
    var obj = k.objetivoAhorro, cub = k.cubiertoAhorro;
    rest = obj;
    pGas = obj > 0 ? clamp(cub / obj * 100, 0, 100) : 0;
    pApa = 0;
    pComp = asig > 0 ? clamp(apa / asig * 100, 0, 100 - pGas) : 0;
    over = false;
    if (k.ahorroHecho){ sub = "Traspaso hecho"; clase = " hecho"; }
    else if (cub < -0.005){ sub = "retirados " + money0(-cub); clase = " falta"; }
    else if (cub > 0.005){ sub = money0(cub) + " de " + money0(obj); }
    else if (apa > 0){ sub = money0(apa) + " en metas"; }
    else { sub = "sin traspasar"; }
  } else {
    rest = asig - gas - apa;
    pGas = asig > 0 ? clamp(gas / asig * 100, 0, 100) : 0;
    pApa = asig > 0 ? clamp(apa / asig * 100, 0, 100 - pGas) : 0;
    pComp = asig > 0 ? clamp(comp / asig * 100, 0, 100 - pGas - pApa) : 0;
    over = gas + apa > asig;
    sub = apa > 0 ? money0(apa) + " en metas"
        : comp > 0 ? money0(comp) + " por pagar"
        : B.verbo.toLowerCase() + " " + money0(gas);
  }

  return '<button class="card sobre s-' + b + (b === "a" && k.ahorroHecho ? ' ok' : '') + '" data-filtro="' + b + '">' +
    '<span class="s-top"><span class="s-pct num">' + (cfg().pct[b] || 0) + '%</span>' +
      (b === "a" && k.ahorroHecho ? '<span class="s-ok">' + ico("check", 13) + '</span>' : '') + '</span>' +
    '<span class="s-nom">' + B.nom + '</span>' +
    '<span class="s-rest num' + (rest < 0 ? ' neg' : '') + '">' + money0(rest) + '</span>' +
    '<span class="bar">' +
      '<i class="fill' + (over ? ' over' : '') + '" style="width:' + pGas.toFixed(1) + '%"></i>' +
      '<i class="apart" style="width:' + pApa.toFixed(1) + '%"></i>' +
      '<i class="pend" style="width:' + pComp.toFixed(1) + '%"></i>' +
    '</span>' +
    '<span class="s-sub' + clase + '">' + sub + '</span>' +
  '</button>';
}

/* ----------------------------------------------------------- movimientos */

var FILTROS = [["", "Todo"], ["e", "Esenciales"], ["o", "Ocio"], ["a", "Ahorro"],
               ["t", "Traspasos"], ["m", "Metas"], ["i", "Ingresos"]];

function pasaFiltro(m, f){
  if (!f) return true;
  if (f === "t") return m.tipo === "traspaso";
  if (f === "m") return m.tipo === "meta";
  if (f === "i") return m.tipo === "ingreso";
  if (f === "a"){
    var ca = cuentaPorRol("ahorro");
    if (m.tipo === "traspaso" && ca && (m.destino === ca.id || m.cuenta === ca.id)) return true;
    return m.tipo === "gasto" && cat(m.cat).b === "a";
  }
  return m.tipo === "gasto" && cat(m.cat).b === f;
}

function pintarMovimientos(){
  var el = document.getElementById("v-movs");
  var f = S.filtro || "";
  var lista = movs(S.mes).filter(function(m){ return pasaFiltro(m, f); }).sort(ordenMovs);

  var html = '<div class="chips" role="group" aria-label="Filtrar">' +
    FILTROS.map(function(x){
      return '<button class="chip-f" data-f="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + '</button>';
    }).join("") + '</div>';

  if (!lista.length){
    html += '<div class="card vacio">' + (f ? 'Nada de este tipo en ' + esc(nombreMes(S.mes)) + '.'
                                            : 'Aún no has registrado nada este mes.<br>Toca <b>+</b> para empezar.') + '</div>';
    el.innerHTML = html;
    return;
  }

  var grupos = {}, orden = [];
  lista.forEach(function(m){
    if (!grupos[m.fecha]){ grupos[m.fecha] = []; orden.push(m.fecha); }
    grupos[m.fecha].push(m);
  });

  html += orden.map(function(fe){
    var gasto = 0;
    grupos[fe].forEach(function(m){ if (m.tipo === "gasto") gasto += (+m.importe || 0); });
    return '<div class="dia">' +
      '<div class="dia-h"><span>' + esc(fechaLarga(fe)) + '</span>' + (gasto ? '<span class="num">' + money(gasto) + '</span>' : '') + '</div>' +
      '<div class="card filas">' + grupos[fe].map(filaMov).join("") + '</div>' +
    '</div>';
  }).join("");

  el.innerHTML = html;
}

function pintarAnalisis(k, c){
  var el = document.getElementById("v-analisis");
  var html = '<div class="ig" style="grid-template-areas:none">';

  // 1 — a dónde ha ido la nómina, medido sobre la nómina
  var ingreso = k.base;
  var usado = {e: k.gastado.e, o: k.gastado.o, a: k.cubiertoAhorro + metasDelMes(S.mes)};
  var total = usado.e + usado.o + usado.a;

  html += '<section class="card panel">' +
    '<div class="ph"><span class="ph-t"><span class="isq">' + ico("grafica", 16) + '</span>A dónde ha ido tu nómina</span></div>';
  if (ingreso > 0){
    html += '<div class="rep">' + ["e", "o", "a"].map(function(b){
      var obj = +c.pct[b] || 0;
      var real = usado[b] / ingreso * 100;
      var escala = Math.max(obj * 1.5, real, 1);
      var pasa = b !== "a" && real > obj + 0.5;
      return '<div class="rep-f s-' + b + '">' +
        '<div class="rep-h"><span>' + BUCKETS[b].nom + '</span><span><b class="num">' + Math.round(real) + '%</b> <em>de ' + obj + '%</em></span></div>' +

          '<u style="left:calc(' + (obj / escala * 100).toFixed(1) + '% - 1px)"></u></div>' +

    }).join("") + '</div>';
    var libre = ingreso - total;
    html += libre >= 0
      ? '<p class="nota-r">Te queda un <b>' + Math.round(libre / ingreso * 100) + '%</b> sin gastar ni mover: <b>' + money(libre) + '</b>.</p>'

  } else {
    html += '<p class="vacio-p">Pon tu nómina en Ajustes para ver el reparto.</p>';

  // 2 — capital ahorrado del mes y patrimonio
  var pat = ahorroTotal();
  var sobra = sobranteMes(S.mes);
  html += '<div class="ig-side">' +
    '<div class="card tile"><span class="isq">' + ico("hucha", 16) + '</span>' +
      '<small class="lbl">Capital ahorrado</small><b class="num">' + money(sobra) + '</b>' +
      '<span class="tile-pie">De más este mes, aparte del ' + (c.pct.a || 0) + '%</span></div>' +
    '<div class="card tile"><span class="isq">' + ico("grafica", 16) + '</span>' +
      '<small class="lbl">Patrimonio total</small><b class="num">' + money(pat.total) + '</b>' +
      '<span class="tile-pie">' + (pat.inicial > 0 ? 'Con ' + money0(pat.inicial) + ' que ya tenías' : 'Todo el historial · EUR') + '</span></div>' +
  '</div>';

  // 3 — dónde está el dinero
  var sal = saldos();
  html += '<section class="card panel">' +
    '<div class="ph"><span class="ph-t"><span class="isq">' + ico("banco", 16) + '</span>Dónde está tu dinero</span>' +
      '<button class="vt" data-aj="cuentas">Ajustar</button></div>' +
    '<div class="lista-r">' +
      sal.cuentas.map(function(x){
        return '<div class="lr"><span class="isq c-n">' + ico(icoCuenta(x), 16) + '</span>' +
          '<span class="fm-t"><b>' + esc(x.nom) + '</b><small>' + esc(ROLES[x.rol] || "Otra") + '</small></span>' +
          '<span class="lr-v num' + (x.saldo < 0 ? ' neg' : '') + '">' + money(x.saldo) + '</span></div>';
      }).join("") +
      '<div class="lr total"><span class="fm-t"><b>Total</b></span><span class="lr-v num">' + money(sal.total) + '</span></div>' +
    '</div>' +
    '<p class="nota-r">Calculado con lo que has registrado. Si no cuadra con tu banco, ajusta el saldo inicial.</p>' +
  '</section>';

  // 4 — plan de traspasos del día de cobro
  if (c.ingresoBase > 0){
    var cAh = cuentaPorRol("ahorro"), cGa = cuentaPorRol("gasto"), cIn = cuentaPorRol("ingresos");
    var aAh = c.ingresoBase * (c.pct.a || 0) / 100, quedaIn = 0;
    (c.fijos || []).forEach(function(f){ if (cIn && f.cuenta === cIn.id) quedaIn += (+f.importe || 0); });
    var aGa = c.ingresoBase - aAh - quedaIn;
    var lin = [];
    if (cAh) lin.push(["Mueve a " + cAh.nom, "El " + (c.pct.a || 0) + "% intocable", aAh, "a"]);
    if (cIn) lin.push(["Deja en " + cIn.nom, "Para las domiciliaciones", quedaIn, "e"]);
    if (cGa) lin.push(["Mueve a " + cGa.nom, "Gasto variable del mes", aGa, "o"]);
    html += '<section class="card panel">' +
      '<div class="ph"><span class="ph-t"><span class="isq">' + ico("flechas", 16) + '</span>Plan de traspasos al cobrar</span></div>' +
      '<div class="lista-r">' + lin.map(function(l){

          '<span class="lr-v num">' + money(l[2]) + '</span></div>';
      }).join("") + '</div>' +
      '<p class="nota-r">Cuando entren los ' + money(c.ingresoBase) + ', reparte así desde tu banco. Ninguna app puede mover tu dinero por ti: esto te dice cuánto.</p>' +
    '</section>';
  }

  html += '</div>';
  el.innerHTML = html;
}

/* ================================ navegación y botón atrás de Android ================ */

var ignorarPop = false;

function mostrarVista(v){
  VISTA = v;
  ["inicio", "movs", "analisis"].forEach(function(x){ document.getElementById("v-" + x).hidden = (x !== v); });
  render();
  window.scrollTo(0, 0);
}

// Salir de Inicio deja una entrada en el historial: así el gesto atrás de
// Android vuelve a Inicio en lugar de cerrar la app.
function irVista(v){
  if (!document.getElementById("v-" + v)) return;
  if (v === VISTA){ window.scrollTo(0, 0); return; }
  if (VISTA === "inicio" && v !== "inicio") history.pushState({gyg: "vista"}, "");
  else if (v === "inicio" && history.state && history.state.gyg === "vista"){ ignorarPop = true; history.back(); }
  mostrarVista(v);
}

// Cada hoja abierta es una entrada más, para que atrás la cierre.
function prepararDialogo(d){
  var abrir = d.showModal.bind(d);
  d.showModal = function(){
    if (d.open) return;
    abrir();
    history.pushState({gyg: "dlg"}, "");
  };
  d.addEventListener("close", function(){
    if (d.dataset.atras){ delete d.dataset.atras; return; }
    if (history.state && history.state.gyg === "dlg"){
      var n = (d === dlgQA && QA) ? QA.paso : 1;   // una entrada por paso del alta rápida
      ignorarPop = true;
      history.go(-n);
    }
  });
}

function cerrarPorAtras(d){ d.dataset.atras = "1"; d.close(); }

window.addEventListener("popstate", function(){
  if (ignorarPop){ ignorarPop = false; return; }
  if (dlgQA.open){
    if (QA && QA.paso > 1){ QA.paso--; pintarRapido(); }
    else cerrarPorAtras(dlgQA);
    return;
  }
  if (dlgMov.open){ cerrarPorAtras(dlgMov); return; }
  if (dlgAj.open){ cerrarPorAtras(dlgAj); return; }
  if (VISTA !== "inicio") mostrarVista("inicio");
});

/* ============================== aviso inferior con deshacer ============================ */

var snackT = null;
function snack(texto, deshacer){
  var s = document.getElementById("snack");
  var b = document.getElementById("snackBtn");
  document.getElementById("snackTxt").textContent = texto;
  b.hidden = !deshacer;
  b.onclick = function(){ s.hidden = true; if (deshacer) deshacer(); };
  s.hidden = false;
  clearTimeout(snackT);
  snackT = setTimeout(function(){ s.hidden = true; }, 5000);
}

function vibrar(){ try{ if (navigator.vibrate) navigator.vibrate(8); }catch(e){} }

/* ================================ alta rápida (el flujo del reel) ====================== */
/* ¿Qué es? → ¿Cuánto cuesta? → ¿De qué es?  Tres toques y listo. */

var dlgQA = document.getElementById("dlgQA");
var QA = null;

function historialGastos(){
  var meses = mesesConocidos(), todos = [];
  Object.keys(meses).forEach(function(id){
    ((meses[id] && meses[id].movimientos) || []).forEach(function(m){
      if (m.tipo === "gasto" && m.concepto && +m.importe > 0) todos.push(m);
    });
  });
  return todos.sort(ordenMovs);
}

function sugerencias(){
  var vistos = {}, out = [];
  historialGastos().forEach(function(m){
    var k = m.concepto.trim().toLowerCase();
    if (vistos[k] || out.length >= 8) return;
    vistos[k] = true;
    out.push(m);
  });
  return out;
}

// La última vez que apuntaste lo mismo: de ahí salen categoría y cuenta.
function recuerdo(concepto){
  var k = (concepto || "").trim().toLowerCase();
  if (!k) return null;
  var h = historialGastos();
  for (var i = 0; i < h.length; i++) if (h[i].concepto.trim().toLowerCase() === k) return h[i];
  return null;
}

function abrirRapido(){
  var cg = cuentaPorRol("gasto");
  QA = {paso: 1, concepto: "", importe: "", cat: null,
        cuenta: cg ? cg.id : ((cfg().cuentas || [])[0] || {}).id};
  pintarRapido();
  dlgQA.showModal();
  setTimeout(function(){ var i = document.getElementById("qaTxt"); if (i) i.focus(); }, 90);
}

function importeQA(){ return parseFloat(String(QA.importe).replace(",", ".")) || 0; }

function montoQA(){
  if (!QA.importe) return '<span class="qa-monto vacio-m num">0<span class="eur">€</span></span>';
  return '<span class="qa-monto num">' + esc(QA.importe) + '<span class="eur">€</span></span>';
}

function pulsarTecla(t){
  vibrar();
  var s = String(QA.importe);
  if (t === "x") s = s.slice(0, -1);
  else if (t === ","){ if (s.indexOf(",") < 0) s = (s || "0") + ","; }
  else {
    var i = s.indexOf(",");
    if (i >= 0 && s.length - i > 2) return;          // como mucho dos decimales
    if (s === "0") s = "";
    if (s.replace(",", "").length >= 7) return;      // hasta 9.999.999
    s += t;
  }
  QA.importe = s;
  document.getElementById("qaMonto").innerHTML = montoQA();
  document.getElementById("qaSig").disabled = !(importeQA() > 0);
}

function avanzarQA(){
  if (QA.paso === 1){
    var txt = document.getElementById("qaTxt");
    QA.concepto = txt ? txt.value.trim() : QA.concepto;
    var r = recuerdo(QA.concepto);
    if (r){ QA.cat = r.cat; QA.cuenta = r.cuenta; if (!QA.importe) QA.importe = String(r.importe).replace(".", ","); }
  } else if (QA.paso === 2){
    if (!(importeQA() > 0)) return;
  }
  QA.paso++;
  history.pushState({gyg: "dlg"}, "");
  pintarRapido();
}

function guardarRapido(){
  if (!QA.cat || !(importeQA() > 0)) return;
  var hoy = hoyISO();
  var reg = {id: uid(), tipo: "gasto", concepto: QA.concepto || cat(QA.cat).nom,
             importe: importeQA(), cat: QA.cat, cuenta: QA.cuenta, fecha: hoy, creado: Date.now()};
  if (S.mes !== hoy.slice(0, 7)) irAMesId(hoy.slice(0, 7));
  anadirMov(reg);
  dlgQA.close();
  snack("Apuntado: " + reg.concepto + " · " + money(reg.importe), function(){ borrarMov(reg.id); });
}

function pintarRapido(){
  var b = document.getElementById("qaBody");
  var pasos = '<div class="qa-pasos" aria-hidden="true">' + [1, 2, 3].map(function(n){
    return '<i' + (n <= QA.paso ? ' class="on"' : '') + '></i>'; }).join("") + '</div>';
  var top = '<div class="qa-top">' +
    '<button class="ico" id="qaAtras" aria-label="' + (QA.paso === 1 ? 'Cerrar' : 'Atrás') + '">' + ico(QA.paso === 1 ? "x" : "atras", 22) + '</button>' +
    pasos + '<button class="enlace" id="qaOtro">Otro tipo</button></div>';

  if (QA.paso === 1){
    var sug = sugerencias();
    b.innerHTML = top +
      '<div class="qa-c">' +
        '<label class="qa-q" for="qaTxt">¿Qué es?</label>' +
        '<input id="qaTxt" class="qa-txt" type="text" autocomplete="off" enterkeyhint="next" placeholder="Compra semanal" value="' + esc(QA.concepto) + '">' +
        (sug.length ? '<div class="qa-sug">' + sug.map(function(m){
          return '<button class="chip-s" data-sug="' + esc(m.concepto) + '">' + esc(m.concepto) + '</button>'; }).join("") + '</div>' : '') +
      '</div>' +
      '<div class="qa-pie"><button class="btn" id="qaSig">Siguiente</button></div>';
  } else if (QA.paso === 2){
    var teclas = ["1","2","3","4","5","6","7","8","9",",","0","x"];
    b.innerHTML = top +
      '<div class="qa-c">' +
        '<p class="qa-q">¿Cuánto cuesta?</p>' +
        (QA.concepto ? '<p class="qa-concepto">' + esc(QA.concepto) + '</p>' : '') +
        '<div id="qaMonto">' + montoQA() + '</div>' +
      '</div>' +
      '<div class="kp">' + teclas.map(function(t){
        return '<button data-k="' + t + '"' + (t === "x" ? ' class="kp-x" aria-label="Borrar"' : '') + '>' +
          (t === "x" ? ico("borrar", 24) : t) + '</button>'; }).join("") + '</div>' +
      '<div class="qa-pie"><button class="btn" id="qaSig"' + (importeQA() > 0 ? '' : ' disabled') + '>Siguiente</button></div>';
  } else {
    var c = cfg();
    var grupo = function(bk){
      var cs = c.categorias.filter(function(x){ return x.b === bk; });
      if (!cs.length) return '';
      return '<span class="lbl">' + BUCKETS[bk].nom + '</span><div class="qa-chips">' + cs.map(function(x){
        return '<button class="chip-c s-' + bk + '" data-cat="' + esc(x.id) + '" aria-pressed="' + (QA.cat === x.id) + '">' +
          ico(icoCat(x.id), 16) + esc(x.nom) + '</button>'; }).join("") + '</div>';
    };
    b.innerHTML = top +
      '<div class="qa-c" style="flex:0 0 auto; padding:18px 0 6px">' +
        '<p class="qa-q">¿De qué es?</p>' +
        '<p class="qa-concepto">' + esc(QA.concepto || "Gasto") + ' · <b class="num" style="color:var(--ink)">' + money(importeQA()) + '</b></p>' +
      '</div>' +
      '<div class="qa-scroll"><div class="qa-g">' +
        grupo("e") + grupo("o") +
        '<span class="lbl">Pagado con</span><div class="qa-chips">' + (c.cuentas || []).map(function(x){
          return '<button class="chip-c s-n" data-cta="' + esc(x.id) + '" aria-pressed="' + (QA.cuenta === x.id) + '">' +
            ico(icoCuenta(x), 16) + esc(x.nom) + '</button>'; }).join("") + '</div>' +
      '</div></div>' +
      '<div class="qa-pie"><button class="btn" id="qaGuardar"' + (QA.cat ? '' : ' disabled') + '>Guardar</button></div>';
  }

  document.getElementById("qaAtras").onclick = function(){ history.back(); };
  document.getElementById("qaOtro").onclick = function(){ dlgQA.close(); abrirMov(null); };

  var sig = document.getElementById("qaSig");
  if (sig) sig.onclick = avanzarQA;
  var gu = document.getElementById("qaGuardar");
  if (gu) gu.onclick = guardarRapido;

  var txt = document.getElementById("qaTxt");
  if (txt) txt.onkeydown = function(ev){ if (ev.key === "Enter"){ ev.preventDefault(); avanzarQA(); } };

  Array.prototype.forEach.call(b.querySelectorAll("[data-sug]"), function(x){
    x.onclick = function(){ document.getElementById("qaTxt").value = x.dataset.sug; avanzarQA(); };
  });
  Array.prototype.forEach.call(b.querySelectorAll("[data-k]"), function(x){
    x.onclick = function(){ pulsarTecla(x.dataset.k); };
  });
  Array.prototype.forEach.call(b.querySelectorAll("[data-cat]"), function(x){
    x.onclick = function(){ QA.cat = x.dataset.cat; vibrar(); pintarRapido(); };
  });
  Array.prototype.forEach.call(b.querySelectorAll("[data-cta]"), function(x){
    x.onclick = function(){ QA.cuenta = x.dataset.cta; vibrar(); pintarRapido(); };
  });
}

// En el ordenador, el teclado también vale para el importe.
document.addEventListener("keydown", function(ev){
  if (!dlgQA.open || !QA || QA.paso !== 2) return;
  if (/^[0-9]$/.test(ev.key)) pulsarTecla(ev.key);
  else if (ev.key === "," || ev.key === ".") pulsarTecla(",");
  else if (ev.key === "Backspace") pulsarTecla("x");
  else if (ev.key === "Enter") avanzarQA();
  else return;
  ev.preventDefault();
});

/* ============================ historial y recuperación ============================ */
/* Dos redes de seguridad, sólo en este dispositivo:
   · Deshacer: antes de cada cambio se guarda cómo estaba lo que se va a pisar.
     Todo lo que escribe una misma acción forma un único paso.
   · Copias mensuales: una foto completa de la app por mes; quedan las 2 últimas. */

var HIST_PASOS = 20;
var grupoPend = null;
var restaurando = false;

function leerHist(n){
  try { return JSON.parse(localStorage.getItem("tresobres:hist:" + n)) || []; } catch(e){ return []; }
}

// Si el almacenamiento se llena, se sacrifican los pasos de deshacer más viejos.
function guardarHist(n, lista){
  for (;;){
    try { localStorage.setItem("tresobres:hist:" + n, JSON.stringify(lista)); return; }
    catch(e){ if (lista.length > 1) lista.shift(); else return; }
  }
}

function clonar(x){ return x == null ? null : JSON.parse(JSON.stringify(x)); }

function asegurarMensual(){
  var lista = leerHist("mensual");
  var mesAct = mesId(new Date());
  if (lista.length && lista[lista.length - 1].mes === mesAct) return;
  lista.push({mes: mesAct, ts: Date.now(), config: clonar(cfg()), meses: clonar(mesesConocidos())});
  while (lista.length > 2) lista.shift();
  guardarHist("mensual", lista);
}

function antesDeEscribir(tipo, id){
  if (restaurando) return;
  asegurarMensual();
  if (!grupoPend){ grupoPend = {ts: Date.now(), cambios: []}; setTimeout(cerrarGrupo, 0); }
  var clave = tipo + ":" + (id || "");
  for (var i = 0; i < grupoPend.cambios.length; i++) if (grupoPend.cambios[i].clave === clave) return;
  var antes = tipo === "config" ? cfg() : (S.meses[id] || almacen.local("mes:" + id) || null);
  grupoPend.cambios.push({clave: clave, tipo: tipo, id: id || null, antes: clonar(antes)});
}

function describirCambio(c){
  if (c.tipo === "config") return JSON.stringify(c.antes) === JSON.stringify(cfg()) ? null : "Ajustes";
  var antes = (c.antes && c.antes.movimientos) || [];
  var ahora = ((S.meses[c.id] || {}).movimientos) || [];
  var ia = {}, ib = {};
  antes.forEach(function(m){ ia[m.id] = m; });
  ahora.forEach(function(m){ ib[m.id] = m; });
  var add = ahora.filter(function(m){ return !ia[m.id]; });
  var del = antes.filter(function(m){ return !ib[m.id]; });
  var mod = ahora.filter(function(m){ return ia[m.id] && JSON.stringify(ia[m.id]) !== JSON.stringify(m); });
  var n = add.length + del.length + mod.length;
  if (!n) return null;
  var nom = function(m){ return "«" + (m.concepto || "sin concepto") + "» " + money(Math.abs(+m.importe || 0)); };
  if (!ahora.length && antes.length > 1) return "Vaciado " + nombreMes(c.id);
  if (n === 1) return add.length ? "Añadido " + nom(add[0]) : del.length ? "Borrado " + nom(del[0]) : "Editado " + nom(mod[0]);
  return n + " cambios en " + nombreMes(c.id);
}

function cerrarGrupo(){
  var g = grupoPend;
  grupoPend = null;
  if (!g) return;
  var d = g.cambios.map(describirCambio).filter(Boolean);
  if (!d.length) return;                       // no cambió nada de verdad
  g.desc = d.join(" · ");
  var pila = leerHist("deshacer");
  pila.push(g);
  while (pila.length > HIST_PASOS) pila.shift();
  guardarHist("deshacer", pila);
}

function aplicarSinHistorial(fn){
  restaurando = true;
  try { fn(); } finally { restaurando = false; }
}

function deshacerUltimo(){
  if (grupoPend) cerrarGrupo();
  var pila = leerHist("deshacer");
  var g = pila.pop();
  if (!g) return null;
  aplicarSinHistorial(function(){
    g.cambios.forEach(function(c){
      if (c.tipo === "config") guardarConfig(normalizarConfig(c.antes || clonar(CONFIG_DEF)));
      else guardarMes(c.id, c.antes || {movimientos: []});
    });
  });
  guardarHist("deshacer", pila);
  return g;
}

// Volver a una copia mensual es un cambio más: se puede deshacer.
function restaurarMensual(i){
  var snap = leerHist("mensual")[i];
  if (!snap) return false;
  var actuales = mesesConocidos();
  guardarConfig(normalizarConfig(clonar(snap.config)));
  Object.keys(actuales).forEach(function(id){ if (!snap.meses[id]) guardarMes(id, {movimientos: []}); });
  Object.keys(snap.meses).forEach(function(id){ guardarMes(id, clonar(snap.meses[id]) || {movimientos: []}); });
  return true;
}

// Sólo el mes que estás viendo. Los demás meses —y lo ahorrado en ellos— quedan igual.
function borrarMesActual(){
  guardarMes(S.mes, {movimientos: []});
}

function hace(ts){
  var s = (Date.now() - ts) / 1000;
  if (s < 60) return "hace un momento";
  if (s < 3600) return "hace " + Math.floor(s / 60) + " min";
  if (s < 86400) return "hace " + Math.floor(s / 3600) + " h";
  var d = new Date(ts);
  return d.getDate() + " " + MESES_C[d.getMonth()] + ", " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

// Dos toques para lo irreversible: el primero arma el botón, el segundo actúa.
function confirmarDoble(btn, aviso, accion){
  if (btn.dataset.arm){ accion(); return; }
  var orig = btn.textContent;
  btn.dataset.arm = "1"; btn.textContent = aviso; btn.classList.add("armado");
  setTimeout(function(){
    if (!btn.isConnected) return;
    delete btn.dataset.arm; btn.textContent = orig; btn.classList.remove("armado");
  }, 4000);
}

function panelRecuperar(parte){
  if (parte === "abajo"){
    var n = movs(S.mes).length;
    return '<div class="peligro">' +
      '<b>Borrar los movimientos de ' + esc(nombreMes(S.mes)) + '</b>' +
      '<p>Deja este mes vacío (' + n + (n === 1 ? ' movimiento' : ' movimientos') + '). Los demás meses, tus ahorros, metas y ajustes no se tocan. ' +
        'Si te equivocas, se puede deshacer desde arriba.</p>' +
      '<button class="btn-rojo" id="hBorrarMes"' + (n ? '' : ' disabled') + '>Borrar este mes</button>' +
    '</div>';
  }
  if (grupoPend) cerrarGrupo();
  var pila = leerHist("deshacer").slice().reverse();
  var mens = leerHist("mensual");
  return '<div class="sec-dat">Deshacer cambios</div>' +
    (pila.length
      ? '<div class="hist">' + pila.slice(0, 5).map(function(g, i){
          return '<div class="hist-f' + (i ? ' viejo' : '') + '">' +
            '<span class="fm-t"><b>' + esc(g.desc) + '</b><small>' + hace(g.ts) + '</small></span>' +
            (i ? '' : '<button class="mini-btn" id="hDeshacer">Deshacer</button>') +
          '</div>';
        }).join("") + '</div>' +
        '<p class="nota" style="margin:0 0 4px">Se guardan los últimos ' + HIST_PASOS + ' cambios. Deshaz de uno en uno, del más reciente hacia atrás.</p>'
      : '<p class="nota" style="margin:0 0 4px">Todavía no hay cambios que deshacer.</p>') +
    '<div class="sec-dat sep">Copias de cada mes</div>' +
    (mens.length
      ? '<div class="hist">' + mens.slice().reverse().map(function(m){
          var i = mens.indexOf(m), nm = 0;
          Object.keys(m.meses || {}).forEach(function(k){ nm += ((m.meses[k] && m.meses[k].movimientos) || []).length; });
          return '<div class="hist-f">' +
            '<span class="fm-t"><b>Como estaba al empezar ' + esc(nombreMes(m.mes)) + '</b><small>' +
              nm + (nm === 1 ? ' movimiento' : ' movimientos') + ' · guardada ' + hace(m.ts) + '</small></span>' +
            '<button class="mini-btn" data-hmes="' + i + '">Volver</button>' +
          '</div>';
        }).join("") + '</div>' +
        '<p class="nota" style="margin:0 0 4px">Se guarda una al empezar cada mes y se conservan las dos últimas.</p>'
      : '') +
    '<div class="sec-dat sep">Copia de seguridad</div>';
}

function cablearRecuperar(){
  var d = document.getElementById("hDeshacer");
  if (d) d.onclick = function(){
    var g = deshacerUltimo();
    pintarAjustes();
    if (g) snack("Deshecho: " + g.desc);
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-hmes]"), function(b){
    b.onclick = function(){
      confirmarDoble(b, "¿Seguro?", function(){
        restaurarMensual(+b.dataset.hmes);
        pintarAjustes();
        snack("Recuperada la copia. Puedes deshacerlo si no era esto.");
      });
    };
  });
  var bm = document.getElementById("hBorrarMes");
  if (bm) bm.onclick = function(){
    confirmarDoble(bm, "Pulsa otra vez para borrar " + nombreMes(S.mes), function(){
      borrarMesActual();
      pintarAjustes();
      snack("Mes vaciado. Tus ahorros de otros meses siguen intactos.", function(){ deshacerUltimo(); pintarAjustes(); });
    });
  };
}

/* ============================ persistencia ============================ */

function guardarConfig(nueva){
  antesDeEscribir("config");
  S.config = nueva;
  almacen.escribir("config/app", "config", nueva);
  render();
}

function guardarMes(id, datos){
  antesDeEscribir("mes", id);
  S.meses[id] = datos;
  almacen.escribir("meses/" + id, "mes:" + id, datos);
  render();
}

function anadirMov(m){
  var id = m.fecha.slice(0,7);
  var mes = S.meses[id] || {movimientos:[]};
  var lista = (mes.movimientos || []).slice();
  lista.push(m);
  guardarMes(id, {movimientos: lista});
}

function actualizarMov(m){
  var id = m.fecha.slice(0,7);
  var previo = null;
  Object.keys(S.meses).forEach(function(k){
    (movs(k)||[]).forEach(function(x){ if (x.id === m.id) previo = k; });
  });
  if (previo && previo !== id){
    guardarMes(previo, {movimientos: movs(previo).filter(function(x){ return x.id !== m.id; })});
  }
  var lista = movs(id).slice();
  var i = -1;
  for (var j=0;j<lista.length;j++) if (lista[j].id === m.id) i = j;
  if (i >= 0) lista[i] = m; else lista.push(m);
  guardarMes(id, {movimientos: lista});
}

function borrarMov(idMov){
  Object.keys(S.meses).forEach(function(k){
    var lista = movs(k);
    if (lista.some(function(x){ return x.id === idMov; })){
      guardarMes(k, {movimientos: lista.filter(function(x){ return x.id !== idMov; })});
    }
  });
}

function registrarFijo(fid){
  var c = cfg(), f = null;
  (c.fijos||[]).forEach(function(x){ if (x.id === fid) f = x; });
  if (!f) return;
  var dia = Math.min(f.dia || 1, diasDelMes(S.mes));
  anadirMov({
    id: uid(), tipo: "gasto", concepto: f.nom, importe: +f.importe || 0,
    cat: f.cat, cuenta: f.cuenta, fecha: S.mes + "-" + String(dia).padStart(2,"0"),
    fijoId: f.id, creado: Date.now()
  });
}

/* ============================ hoja: movimiento ============================ */

var dlgMov = document.getElementById("dlgMov");
var borradorTipo = "gasto";

function abrirMov(idExistente){
  var m = null;
  if (idExistente){
    movs(S.mes).forEach(function(x){ if (x.id === idExistente) m = x; });
  }
  borradorTipo = m ? m.tipo : "gasto";
  pintarMov(m);
  dlgMov.showModal();
  setTimeout(function(){
    var i = document.getElementById("mImporte");
    if (i && !idExistente) i.focus();
  }, 60);
}

function pintarMov(m){
  var c = cfg();
  var esNuevo = !m;
  var devol = m ? (+m.importe < 0) : false;
  var imp = m ? Math.abs(+m.importe) : "";

  var opcionesCat = ["e","o","a"].map(function(b){
    var items = c.categorias.filter(function(x){ return x.b === b; });
    if (!items.length) return "";
    return '<optgroup label="' + BUCKETS[b].nom + ' · ' + (c.pct[b]||0) + '%">' +
      items.map(function(x){
        return '<option value="' + esc(x.id) + '"' + (m && m.cat === x.id ? " selected" : "") + '>' + esc(x.nom) + '</option>';
      }).join("") + '</optgroup>';
  }).join("");

  var opcionesCuenta = function(sel){
    return c.cuentas.map(function(x){
      return '<option value="' + esc(x.id) + '"' + (sel === x.id ? " selected" : "") + '>' + esc(x.nom) + '</option>';
    }).join("");
  };

  var t = borradorTipo;
  document.getElementById("movBody").innerHTML =
    '<h2>' + (esNuevo ? "Nuevo movimiento" : "Editar movimiento") +
      '<button class="ico" id="mCerrar" aria-label="Cerrar">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></h2>' +

    '<div class="seg" role="group" style="margin-bottom:14px">' +
      ['gasto','ingreso','traspaso','meta'].map(function(x){
        return '<button type="button" data-tipo="' + x + '" aria-pressed="' + (t===x) + '">' +
          (x==="gasto"?"Gasto":x==="ingreso"?"Ingreso":x==="traspaso"?"Traspaso":"Meta") + '</button>';
      }).join("") +
    '</div>' +

    '<div class="campo importe">' +
      '<label for="mImporte">Importe</label>' +
      '<input type="number" id="mImporte" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="' + imp + '">' +
    '</div>' +

    '<div class="campo">' +
      '<label for="mConcepto">Concepto</label>' +
      '<input type="text" id="mConcepto" placeholder="' +
        (t==="gasto"?"Mercadona, cena con Ana…":t==="ingreso"?"Paga extra, factura freelance…":
         t==="meta"?"Aportación del mes":"Traspaso mensual") +
        '" value="' + esc(m ? m.concepto : "") + '">' +
    '</div>' +

    (t === "gasto" ?
      '<div class="campo">' +
        '<label for="mCat">Categoría</label>' +
        '<select id="mCat">' + opcionesCat + '</select>' +
      '</div>' +
      '<label class="check"><input type="checkbox" id="mDevol"' + (devol ? " checked" : "") + '>' +
        '<span>Es una devolución o un Bizum que me han devuelto</span></label>'
    : '') +

    (t === "meta" ? (
      (c.metas && c.metas.length) ?
        '<div class="campo">' +
          '<label for="mMeta">A qué meta</label>' +
          '<select id="mMeta">' +
            c.metas.map(function(x, i){
              return '<option value="' + esc(x.id) + '"' + ((m && m.metaId === x.id) || (!m && i === 0) ? " selected" : "") + '>' +
                (i+1) + '. ' + esc(x.nombre) + '</option>';
            }).join("") +
          '</select>' +
        '</div>' +
        '<label class="check"><input type="checkbox" id="mSacar"' + (devol ? " checked" : "") + '>' +
          '<span>Sacar dinero de esta meta</span></label>' +
        '<div id="mAviso"></div>'
      : '<p class="nota">Todavía no has creado ninguna meta. Ve a <b>Ajustes → Metas</b> y crea una.</p>'
    ) : '') +

    (t === "traspaso" ?
      '<div class="fila2">' +
        '<div class="campo"><label for="mCuenta">Desde</label><select id="mCuenta">' + opcionesCuenta(m ? m.cuenta : "sab") + '</select></div>' +
        '<div class="campo"><label for="mDestino">Hasta</label><select id="mDestino">' + opcionesCuenta(m ? m.destino : "tr") + '</select></div>' +
      '</div>' +
      '<p class="nota">Mover dinero entre tus cuentas no es un gasto: no toca ningún sobre.</p>'
    :
      '<div class="fila2">' +
        '<div class="campo"><label for="mCuenta">Cuenta</label><select id="mCuenta">' + opcionesCuenta(m ? m.cuenta : (t==="ingreso" ? "sab" : "tr")) + '</select></div>' +
        '<div class="campo"><label for="mFecha">Fecha</label><input type="date" id="mFecha" value="' + (m ? m.fecha : hoyISO()) + '"></div>' +
      '</div>'
    ) +

    (t === "traspaso" ?
      '<div class="campo"><label for="mFecha">Fecha</label><input type="date" id="mFecha" value="' + (m ? m.fecha : hoyISO()) + '"></div>'
    : '') +

    (t === "ingreso" ? '<p class="nota">Un ingreso extra se suma a la base del mes y hace crecer los tres sobres automáticamente.</p>' : '') +

    (t === "meta" && c.metas && c.metas.length ?
      '<p class="nota">Puedes destinar ' + money(margenMetas(S.mes)) + ' más este mes. Sale del ocio y de hasta un 10% del sobre de ahorro; de los esenciales, nada.</p>' : '') +

    '<div class="acciones">' +
      (esNuevo ? '' : '<button class="btn del" id="mBorrar">Borrar</button>') +
      '<button class="btn" id="mGuardar">' + (esNuevo ? "Añadir" : "Guardar") + '</button>' +
    '</div>';

  var body = document.getElementById("movBody");
  document.getElementById("mCerrar").onclick = function(){ dlgMov.close(); };

  Array.prototype.forEach.call(body.querySelectorAll("[data-tipo]"), function(b){
    b.onclick = function(){ borradorTipo = b.dataset.tipo; pintarMov(m); };
  });

  document.getElementById("mGuardar").onclick = function(){
    var v = parseFloat(String(document.getElementById("mImporte").value).replace(",","."));
    if (!v || v <= 0){ document.getElementById("mImporte").focus(); return; }
    var elDev = document.getElementById("mDevol");
    var reg = {
      id: m ? m.id : uid(),
      tipo: borradorTipo,
      concepto: document.getElementById("mConcepto").value.trim(),
      importe: (elDev && elDev.checked) ? -v : v,
      cuenta: document.getElementById("mCuenta").value,
      fecha: document.getElementById("mFecha").value || hoyISO(),
      creado: m ? (m.creado || Date.now()) : Date.now()
    };
    if (borradorTipo === "gasto") reg.cat = document.getElementById("mCat").value;
    if (borradorTipo === "traspaso") reg.destino = document.getElementById("mDestino").value;

    if (borradorTipo === "meta"){
      var selMeta = document.getElementById("mMeta");
      if (!selMeta) return;                       // sin metas creadas, no hay nada que aportar
      reg.metaId = selMeta.value;
      var saca = document.getElementById("mSacar");
      if (saca && saca.checked) {
        reg.importe = -v;
      } else {
        // El tope es del mes al que se imputa, y al editar no cuenta contra sí mismo.
        var mesReg = reg.fecha.slice(0, 7);
        var propio = (m && m.tipo === "meta" && m.fecha.slice(0,7) === mesReg && +m.importe > 0)
                     ? (+m.importe) : 0;
        var margen = margenMetas(mesReg) + propio;
        if (v > margen + 0.005){
          avisoMov("Este mes sólo puedes destinar " + money(margen) + " más a metas. " +
                   "Sale del ocio y de hasta un 10% del sobre de ahorro; de los esenciales, nada.");
          return;
        }
      }
    }
    if (m && m.fijoId) reg.fijoId = m.fijoId;

    if (m) actualizarMov(reg); else anadirMov(reg);
    dlgMov.close();
  };

  var del = document.getElementById("mBorrar");
  if (del) del.onclick = function(){ borrarMov(m.id); dlgMov.close(); };
}
