              '<input type="text" data-cn="' + i + '" value="' + esc(x.nom) + '" aria-label="Nombre" style="font-size:13.5px;padding:7px 9px">' +
              '<div class="fila2" style="gap:6px">' +
                '<select data-cr="' + i + '" aria-label="Para qué sirve" style="font-size:12px;padding:6px 9px">' +
                  Object.keys(ROLES).map(function(r){
                    return '<option value="' + r + '"' + (x.rol===r?" selected":"") + '>' + ROLES[r] + '</option>';
                  }).join("") +
                '</select>' +
                '<input type="number" data-ci="' + i + '" inputmode="decimal" step="0.01" placeholder="ya tenía" value="' + (x.inicial || "") + '" aria-label="Saldo inicial" style="font-size:12px;padding:6px 9px">' +
              '</div>' +
            '</div>' +
            '<button class="x" data-cx="' + i + '" aria-label="Quitar cuenta">' +
              '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>' +
          '</div>';
        }).join("") +
      '</div>' +
      '<button class="add" id="aAddCuenta">+ Añadir cuenta</button>' +
      '<div class="acciones"><button class="btn" id="aGuardar">Guardar</button></div>';
  }

  if (pestana === "fijos"){
    cuerpo =
      '<p class="nota" style="margin-top:0">Alquiler, gimnasio, seguros, suscripciones. La app los descuenta como <b>comprometido</b> hasta que los registras, para que no confundas el saldo con dinero libre.</p>' +
      '<div class="listaed">' +
        (c.fijos||[]).map(function(f, i){
          return '<div class="item">' +
            '<div class="g"><b>' + esc(f.nom) + '</b><span>' + esc(cat(f.cat).nom) + ' · ' + esc(cuenta(f.cuenta).nom) + ' · día ' + (f.dia||1) + '</span></div>' +
            '<div class="im num">' + money(f.importe) + '</div>' +
            '<button class="x" data-fx="' + i + '" aria-label="Quitar gasto fijo">' +
              '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>' +
          '</div>';
        }).join("") +
        (!(c.fijos||[]).length ? '<p class="nota" style="margin:0">Todavía no has puesto ninguno.</p>' : '') +
      '</div>' +
      '<div class="campo"><label for="fNom">Nuevo gasto fijo</label>' +
        '<input type="text" id="fNom" placeholder="Alquiler"></div>' +
      '<div class="fila2">' +
        '<div class="campo"><label for="fImp">Importe</label><input type="number" id="fImp" inputmode="decimal" step="0.01" min="0" placeholder="0,00"></div>' +
        '<div class="campo"><label for="fDia">Día del mes</label><input type="number" id="fDia" inputmode="numeric" min="1" max="31" value="1"></div>' +
      '</div>' +
      '<div class="fila2">' +
        '<div class="campo"><label for="fCat">Categoría</label><select id="fCat">' +
          c.categorias.map(function(x){ return '<option value="' + esc(x.id) + '">' + esc(x.nom) + '</option>'; }).join("") +
        '</select></div>' +
        '<div class="campo"><label for="fCue">Cuenta</label><select id="fCue">' +
          c.cuentas.map(function(x){ return '<option value="' + esc(x.id) + '">' + esc(x.nom) + '</option>'; }).join("") +
        '</select></div>' +
      '</div>' +
      '<button class="add" id="aAddFijo">+ Añadir gasto fijo</button>';
  }

  if (pestana === "cats"){
    cuerpo =
      '<p class="nota" style="margin-top:0">La categoría decide en qué sobre cae el gasto, no la cuenta desde la que pagas.</p>' +
      ["e","o","a"].map(function(b){
        return '<div class="lbl" style="margin:14px 0 7px;color:var(--' + b + ')">' + BUCKETS[b].nom + '</div>' +
          '<div class="listaed">' +
            c.categorias.filter(function(x){ return x.b === b; }).map(function(x){
              var i = c.categorias.indexOf(x);
              return '<div class="item"><div class="g"><b>' + esc(x.nom) + '</b></div>' +
                '<button class="x" data-kx="' + i + '" aria-label="Quitar categoría">' +
                '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
            }).join("") +
          '</div>';
      }).join("") +
      '<div class="fila2" style="margin-top:14px">' +
        '<div class="campo"><label for="kNom">Nueva categoría</label><input type="text" id="kNom" placeholder="Peluquería"></div>' +
        '<div class="campo"><label for="kB">Sobre</label><select id="kB">' +
          ["e","o","a"].map(function(b){ return '<option value="' + b + '">' + BUCKETS[b].nom + '</option>'; }).join("") +
        '</select></div>' +
      '</div>' +
      '<button class="add" id="aAddCat">+ Añadir categoría</button>';
  }

  if (pestana === "meta"){
    var ms = c.metas || [];
    var est = estadoMetas();
    var tope = topeMetas(null);
    var sumaPrev = 0;
    ms.forEach(function(x){ sumaPrev += +x.aportacion || 0; });
    var pasado = sumaPrev > tope.total + 0.005;
    cuerpo =
      '<p class="nota" style="margin-top:0">Ahorra para compras concretas. El número es la prioridad: usa las flechas para cambiarlo.</p>' +
      '<div class="listaed">' +
        (ms.length ? est.map(function(mt, i){
          return '<div class="item">' +
            '<div class="ord">' +
              '<button type="button" data-sube="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Subir prioridad">&#9650;</button>' +
              '<button type="button" data-baja="' + i + '"' + (i === ms.length - 1 ? ' disabled' : '') + ' aria-label="Bajar prioridad">&#9660;</button>' +
            '</div>' +
            '<div class="g" style="display:grid;gap:6px">' +
              '<input type="text" data-mn="' + i + '" value="' + esc(mt.nombre) + '" aria-label="Nombre" style="font-size:13.5px;padding:7px 9px">' +
              '<div class="fila2" style="gap:6px">' +
                '<input type="number" data-mo="' + i + '" inputmode="decimal" step="0.01" min="0" value="' + (mt.objetivo || "") + '" aria-label="Cuánto cuesta" style="font-size:12.5px;padding:6px 9px">' +
                '<input type="number" data-ma="' + i + '" inputmode="decimal" step="0.01" min="0" placeholder="al mes" value="' + (ms[i].aportacion || "") + '" aria-label="Aportación prevista al mes" style="font-size:12.5px;padding:6px 9px">' +
              '</div>' +
              '<span style="font-size:10.5px;color:var(--ink-3)">Llevas ' + money(mt.acumulado) +
                (mt.faltan ? ' · ' + mt.faltan + (mt.faltan === 1 ? ' mes' : ' meses') + ' para completarla' : '') + '</span>' +
            '</div>' +
            '<button class="x" data-mx="' + i + '" aria-label="Quitar meta"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>' +
          '</div>';
        }).join("") : '<p class="nota" style="margin:0">Todavía no has creado ninguna.</p>') +
      '</div>' +
      (ms.length ? '<div class="tope ' + (pasado ? 'mal' : '') + '">Previsto ' + money(sumaPrev) +
        ' al mes entre todas · tope ' + money(tope.total) +
        (pasado ? ' — no te va a dar' : '') + '</div>' : '') +
      '<div class="fila2">' +
        '<div class="campo"><label for="mtNom">Nueva meta</label>' +
          '<input type="text" id="mtNom" placeholder="Un coche"></div>' +
        '<div class="campo"><label for="mtObj">Cuánto cuesta</label>' +
          '<input type="number" id="mtObj" inputmode="decimal" step="0.01" min="0" placeholder="0,00"></div>' +
      '</div>' +
      '<button class="add" id="mtAdd">+ Añadir meta</button>' +
      (ms.length ? '<div class="acciones"><button class="btn" id="mtGuardar">Guardar cambios</button></div>' : '') +
      '<p class="nota" style="margin-top:14px">Para aportar, toca el <b>+</b> de la pantalla principal y elige <b>Meta</b>. ' +
        'La aportación mensual es una previsión: sirve para estimar la fecha mientras no haya aportaciones reales.</p>';
  }

  document.getElementById("ajBody").innerHTML =
    '<h2>Ajustes<button class="ico" id="aCerrar" aria-label="Cerrar">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></h2>' +
    '<div class="tabs" role="group">' +
      [["general","Reparto"],["meta","Metas"],["cuentas","Cuentas"],["fijos","Fijos"],["cats","Categorías"]].map(function(p){
        return '<button type="button" data-tab="' + p[0] + '" aria-pressed="' + (pestana===p[0]) + '">' + p[1] + '</button>';
      }).join("") +
    '</div>' + cuerpo;

  var body = document.getElementById("ajBody");
  // Con seis pestañas no caben todas: que la activa quede siempre a la vista.
  var tabOn = body.querySelector('.tabs [aria-pressed="true"]');
  if (tabOn && tabOn.scrollIntoView) tabOn.scrollIntoView({block: "nearest", inline: "center"});
  document.getElementById("aCerrar").onclick = function(){ dlgAj.close(); };
  Array.prototype.forEach.call(body.querySelectorAll("[data-tab]"), function(b){
    b.onclick = function(){ pestana = b.dataset.tab; pintarAjustes(); };
  });

  // general
  var g = document.getElementById("aGuardar");
  if (g && pestana === "general"){
    ["aPe","aPo","aPa"].forEach(function(idp){
      var el = document.getElementById(idp);
      if (el) el.oninput = function(){
        var s = (+document.getElementById("aPe").value||0) + (+document.getElementById("aPo").value||0) + (+document.getElementById("aPa").value||0);
        var d = document.getElementById("aSuma");
        d.className = "sum " + (s === 100 ? "good" : "bad");
        d.textContent = "Suma: " + s + "%" + (s === 100 ? " ✓" : " — debería sumar 100");
      };
    });
    g.onclick = function(){
      var n = JSON.parse(JSON.stringify(cfg()));
      n.ingresoBase = parseFloat(String(document.getElementById("aBase").value).replace(",",".")) || 0;
      n.pct = {
        e: +document.getElementById("aPe").value || 0,
        o: +document.getElementById("aPo").value || 0,
        a: +document.getElementById("aPa").value || 0
      };
      guardarConfig(n);
      dlgAj.close();
    };
  }

  // metas de ahorro
  if (pestana === "meta"){
    var mover = function(de, a){
      var n = JSON.parse(JSON.stringify(cfg()));
      var t = n.metas[de]; n.metas[de] = n.metas[a]; n.metas[a] = t;
      guardarConfig(n); pintarAjustes();
    };
    Array.prototype.forEach.call(body.querySelectorAll("[data-sube]"), function(b){
      b.onclick = function(){ var i = +b.dataset.sube; mover(i, i - 1); };
    });
    Array.prototype.forEach.call(body.querySelectorAll("[data-baja]"), function(b){
      b.onclick = function(){ var i = +b.dataset.baja; mover(i, i + 1); };
    });
    Array.prototype.forEach.call(body.querySelectorAll("[data-mx]"), function(b){
      b.onclick = function(){
        var n = JSON.parse(JSON.stringify(cfg()));
        n.metas.splice(+b.dataset.mx, 1);
        guardarConfig(n); pintarAjustes();
      };
    });
    var mtG = document.getElementById("mtGuardar");
    if (mtG) mtG.onclick = function(){
      var n = JSON.parse(JSON.stringify(cfg()));
      Array.prototype.forEach.call(body.querySelectorAll("[data-mn]"), function(el){
        n.metas[+el.dataset.mn].nombre = el.value.trim() || "Meta";
      });
      Array.prototype.forEach.call(body.querySelectorAll("[data-mo]"), function(el){
        n.metas[+el.dataset.mo].objetivo = parseFloat(String(el.value).replace(",", ".")) || 0;
      });
      Array.prototype.forEach.call(body.querySelectorAll("[data-ma]"), function(el){
        n.metas[+el.dataset.ma].aportacion = parseFloat(String(el.value).replace(",", ".")) || 0;
      });
      guardarConfig(n);
      dlgAj.close();
    };
    document.getElementById("mtAdd").onclick = function(){
      var nom = document.getElementById("mtNom").value.trim();
      var obj = parseFloat(String(document.getElementById("mtObj").value).replace(",", ".")) || 0;
      if (!nom || !obj){ document.getElementById(nom ? "mtObj" : "mtNom").focus(); return; }
      var n = JSON.parse(JSON.stringify(cfg()));
      n.metas = n.metas || [];
      n.metas.push({id: uid(), nombre: nom, objetivo: obj});
      guardarConfig(n); pintarAjustes();
    };
  }

  // cuentas
  if (pestana === "cuentas"){
    document.getElementById("aAddCuenta").onclick = function(){
      var n = JSON.parse(JSON.stringify(cfg()));
      n.cuentas.push({id: uid(), nom: "Nueva cuenta", rol: "otro", inicial: 0});
      guardarConfig(n); pintarAjustes();
    };
    Array.prototype.forEach.call(body.querySelectorAll("[data-cx]"), function(b){
      b.onclick = function(){
        var n = JSON.parse(JSON.stringify(cfg()));
        n.cuentas.splice(+b.dataset.cx, 1);
        guardarConfig(n); pintarAjustes();
      };
    });
    document.getElementById("aGuardar").onclick = function(){
      var n = JSON.parse(JSON.stringify(cfg()));
      Array.prototype.forEach.call(body.querySelectorAll("[data-cn]"), function(el){
        n.cuentas[+el.dataset.cn].nom = el.value.trim() || "Cuenta";
      });
      Array.prototype.forEach.call(body.querySelectorAll("[data-cr]"), function(el){
        n.cuentas[+el.dataset.cr].rol = el.value;
      });
      Array.prototype.forEach.call(body.querySelectorAll("[data-ci]"), function(el){
        n.cuentas[+el.dataset.ci].inicial = parseFloat(String(el.value).replace(",", ".")) || 0;
      });
      guardarConfig(n);
      dlgAj.close();
    };
  }

  // fijos
  if (pestana === "fijos"){
    document.getElementById("aAddFijo").onclick = function(){
      var nom = document.getElementById("fNom").value.trim();
      var imp = parseFloat(String(document.getElementById("fImp").value).replace(",","."));
      if (!nom || !imp){ document.getElementById("fNom").focus(); return; }
      var n = JSON.parse(JSON.stringify(cfg()));
      n.fijos = n.fijos || [];
      n.fijos.push({
        id: uid(), nom: nom, importe: imp,
        cat: document.getElementById("fCat").value,
        cuenta: document.getElementById("fCue").value,
        dia: clamp(+document.getElementById("fDia").value || 1, 1, 31)
      });
      guardarConfig(n); pintarAjustes();
    };
    Array.prototype.forEach.call(body.querySelectorAll("[data-fx]"), function(b){
      b.onclick = function(){
        var n = JSON.parse(JSON.stringify(cfg()));
        n.fijos.splice(+b.dataset.fx, 1);
        guardarConfig(n); pintarAjustes();
      };
    });
  }

  // categorías
  if (pestana === "cats"){
    document.getElementById("aAddCat").onclick = function(){
      var nom = document.getElementById("kNom").value.trim();
      if (!nom){ document.getElementById("kNom").focus(); return; }
      var n = JSON.parse(JSON.stringify(cfg()));
      n.categorias.push({id: uid(), nom: nom, b: document.getElementById("kB").value});
      guardarConfig(n); pintarAjustes();
    };
    Array.prototype.forEach.call(body.querySelectorAll("[data-kx]"), function(b){
      b.onclick = function(){
        var n = JSON.parse(JSON.stringify(cfg()));
        n.categorias.splice(+b.dataset.kx, 1);
        guardarConfig(n); pintarAjustes();
      };
    });
  }
}

/* ============================ arranque ============================ */

function cargarLocal(){
  var c = almacen.local("config");
  S.config = normalizarConfig(c || JSON.parse(JSON.stringify(CONFIG_DEF)));
  if (configMigrada) almacen.escribir("config/app", "config", S.config);
  var m = almacen.local("mes:" + S.mes);
  if (m) S.meses[S.mes] = m;
  var p = almacen.local("mes:" + mesAnterior(S.mes));
  if (p) S.meses[mesAnterior(S.mes)] = p;
}

function suscribirMes(){
  S.desub.forEach(function(f){ try{ f(); }catch(e){} });
  S.desub = [];
  if (!almacen.db) return;

  S.desub.push(almacen.suscribir("config/app", "config", function(datos){
    if (datos) {
      S.config = normalizarConfig(datos);
      if (configMigrada) almacen.escribir("config/app", "config", S.config);
      render();
    }
  }));

  [S.mes, mesAnterior(S.mes)].forEach(function(id){
    S.desub.push(almacen.suscribir("meses/" + id, "mes:" + id, function(datos){
      S.meses[id] = datos || {movimientos: []};
      render();
    }));
  });
}

function irAMes(delta){
  var d = mesDesde(S.mes);
  d.setMonth(d.getMonth() + delta);
  S.mes = mesId(d);
  var m = almacen.local("mes:" + S.mes);
  if (!S.meses[S.mes]) S.meses[S.mes] = m || {movimientos: []};
  suscribirMes();
  render();
}

function irAMesId(id){
  S.mes = id;
  if (!S.meses[id]) S.meses[id] = almacen.local("mes:" + id) || {movimientos: []};
  suscribirMes();
  render();
}

document.getElementById("prev").onclick = function(){ irAMes(-1); };
document.getElementById("next").onclick = function(){ irAMes(1); };
document.getElementById("fab").onclick = function(){ abrirRapido(); };
document.getElementById("abrirAjustes").onclick = function(){ abrirAjustes("general"); };

Array.prototype.forEach.call(document.querySelectorAll(".nv[data-vista]"), function(b){
  b.onclick = function(){ irVista(b.dataset.vista); };
});

// Un único escuchador por vista: el contenido se repinta, el escuchador no.
["v-inicio", "v-movs", "v-analisis"].forEach(function(id){
  document.getElementById(id).addEventListener("click", function(ev){
    var t = ev.target.closest("[data-ir],[data-filtro],[data-f],[data-aj],[data-id],[data-fijo],[data-base]");
    if (!t) return;
    var ds = t.dataset;
    if (ds.ir) irVista(ds.ir);
    else if (ds.filtro){ S.filtro = ds.filtro; irVista("movs"); }
    else if (ds.f !== undefined){ S.filtro = ds.f || null; render(); }
    else if (ds.aj) abrirAjustes(ds.aj);
    else if (ds.id) abrirMov(ds.id);
    else if (ds.fijo) registrarFijo(ds.fijo);
    else if (ds.base) abrirAjustes("general");
  });
});

[dlgMov, dlgAj, dlgQA].forEach(prepararDialogo);
[dlgMov, dlgAj].forEach(function(d){
  d.addEventListener("click", function(ev){ if (ev.target === d) d.close(); });
});

// Sin esto, el navegador puede borrar los datos si le falta espacio.
// Una app instalada suele obtener el permiso automaticamente.
if (navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(function(ya){
    if (!ya) return navigator.storage.persist();
  }).catch(function(){});
}

cargarLocal();
asegurarMensual();
render();

// Atajos del icono: al mantener pulsado G&G en el móvil aparecen "Nuevo gasto"
// y "Movimientos". Llegan como ?accion=gasto y ?vista=movs.
(function(){
  var q = new URLSearchParams(location.search);
  var v = q.get("vista"), a = q.get("accion");
  if (v || a) history.replaceState(null, "", location.pathname);
  if (v && v !== "inicio" && document.getElementById("v-" + v)) irVista(v);
  if (a === "gasto") setTimeout(abrirRapido, 60);
})();

almacen.conectar(function(){
  // primera conexión con la nube: si está vacía, sube lo que haya en local
  almacen.db.doc("config/app").get().then(function(snap){
    if (!snap.exists) {
      almacen.escribir("config/app", "config", S.config);
      almacen.escribir("meses/" + S.mes, "mes:" + S.mes, S.meses[S.mes] || {movimientos: []});
    }
    suscribirMes();
    render();
  }).catch(function(){ suscribirMes(); render(); });
});

})();
</script>
